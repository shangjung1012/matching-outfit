services:
  tryon:
    platform: linux/amd64
    build:
      context: .
    container_name: tryon-api
    environment:
      TRYON_API_KEY: ${TRYON_API_KEY:?Set TRYON_API_KEY in tryon/.env}
      TRYON_MIXED_PRECISION: ${TRYON_MIXED_PRECISION:-bf16}
      HF_HOME: /models/huggingface
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in tryon/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in tryon/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:-tryon}
      MINIO_SECURE: "false"
    expose:
      - 9001
    volumes:
      - tryon_hf_cache:/models/huggingface
    depends_on:
      minio:
        condition: service_healthy
    devices:
      - nvidia.com/gpu=all

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tryon-cloudflared
    profiles: ["tunnel"]
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - tryon
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: tryon-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in tryon/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in tryon/.env}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - tryon_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tryon_hf_cache:
  tryon_minio_data:
