services:
  catvton:
    platform: linux/amd64
    build:
      context: .
    container_name: catvton-api
    environment:
      CATVTON_API_KEY: ${CATVTON_API_KEY:?Set CATVTON_API_KEY in catvton/.env}
      CATVTON_MIXED_PRECISION: ${CATVTON_MIXED_PRECISION:-bf16}
      HF_HOME: /models/huggingface
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in catvton/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in catvton/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:-catvton}
      MINIO_SECURE: "false"
    ports:
      - "${CATVTON_BIND_ADDRESS:-0.0.0.0}:${CATVTON_PORT:-9002}:9001"
    volumes:
      - catvton_hf_cache:/models/huggingface
    depends_on:
      minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  minio:
    image: minio/minio:latest
    container_name: catvton-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in catvton/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in catvton/.env}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catvton_hf_cache:
  minio_data:
