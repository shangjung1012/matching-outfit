services:
  backend:
    build:
      context: ./backend
    container_name: matching-outfit-backend
    environment:
      DATABASE_URL: postgresql+psycopg://matching_user:matching_password@postgres:5432/matching_outfit
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    container_name: matching-outfit-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  postgres:
    image: postgres:16-alpine
    container_name: matching-outfit-postgres
    environment:
      POSTGRES_DB: matching_outfit
      POSTGRES_USER: matching_user
      POSTGRES_PASSWORD: matching_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matching_user -d matching_outfit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
