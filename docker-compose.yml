services:
  backend:
    build:
      context: ./backend
    container_name: matching-outfit-backend
    environment:
      DATABASE_URL: postgresql+psycopg://matching_user:matching_password@postgres:5432/matching_outfit
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      IMAGE_DIR: /data/images
      FASHION_CLIP_MODEL: patrickjohncyh/fashion-clip
      CATALOG_CURRENCY: ${CATALOG_CURRENCY:-INR}
      ARTICLE_DATA_DIR: /data/articles
      ARTICLE_ALLOWED_DOMAINS: ${ARTICLE_ALLOWED_DOMAINS:-elle.com,www.elle.com,gq.com.tw,www.gq.com.tw,marieclairekorea.com,www.marieclairekorea.com,gqkorea.co.kr,www.gqkorea.co.kr}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTICLE_EXTRACTION_MODEL: ${ARTICLE_EXTRACTION_MODEL:-gpt-4.1-mini}
      STYLING_PLANNER_MODEL: ${STYLING_PLANNER_MODEL:-gpt-4.1-mini}
      AESTHETIC_REVIEW_MODEL: ${AESTHETIC_REVIEW_MODEL:-gpt-4.1-mini}
      AESTHETIC_REVIEW_ENABLED: ${AESTHETIC_REVIEW_ENABLED:-true}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-text-embedding-3-small}
      KNOWLEDGE_EMBEDDING_DIMENSIONS: ${KNOWLEDGE_EMBEDDING_DIMENSIONS:-512}
      HF_HOME: /models/huggingface
      CATVTON_API_URL: ${CATVTON_API_URL:-}
      CATVTON_API_KEY: ${CATVTON_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data:/data
      - huggingface_cache:/models/huggingface

  frontend:
    build:
      context: ./frontend
    container_name: matching-outfit-frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  postgres:
    image: pgvector/pgvector:pg16
    container_name: matching-outfit-postgres
    environment:
      POSTGRES_DB: matching_outfit
      POSTGRES_USER: matching_user
      POSTGRES_PASSWORD: matching_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matching_user -d matching_outfit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  huggingface_cache:
